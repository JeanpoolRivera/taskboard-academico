<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBoard Académico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="banner">
            <h1>TaskBoard Académico</h1>
            <p>Gestor de tareas académicas</p>
        </header>

        <section class="form-section">
            <h2>Registrar Nueva Tarea</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="title">Título *</label>
                    <input type="text" id="title" placeholder="Ej: Ensayo de historia" required>
                </div>
                <div class="form-group">
                    <label for="course">Curso</label>
                    <input type="text" id="course" placeholder="Ej: Historia del Perú">
                </div>
                <div class="form-group">
                    <label for="priority">Prioridad</label>
                    <select id="priority">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Agregar tarea</button>
            </form>
            <p id="validationMsg" class="validation-msg"></p>
        </section>

        <section class="stats-section">
            <div class="stat-card">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">Pendientes</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="completedCount">0</span>
                <span class="stat-label">Completadas</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">Total</span>
            </div>
        </section>

        <section class="filter-section">
            <h2>Filtrar Tareas</h2>
            <div class="filter-buttons">
                <button class="btn btn-filter active" data-filter="todas">Todas</button>
                <button class="btn btn-filter" data-filter="pendientes">Pendientes</button>
                <button class="btn btn-filter" data-filter="completadas">Completadas</button>
            </div>
        </section>

        <section class="tasks-section">
            <h2>Mis Tareas</h2>
            <div id="taskList" class="task-list"></div>
            <p id="emptyMsg" class="empty-msg">No hay tareas registradas</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
